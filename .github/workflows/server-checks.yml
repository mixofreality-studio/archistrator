name: Server Checks

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.aiarch/**/*.json'
      - '.claude/**'
      - '.github/workflows/server-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.aiarch/**/*.json'
      - '.claude/**'
      - '.github/workflows/server-checks.yml'

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # 1.26+ required by the "Go fix check" step (analyzer-based `go fix`).
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run 'gofmt -w .'"; exit 1; }

      - name: Go vet
        run: GOWORK=off go vet ./...

      # Analyzer-based `go fix` (Go 1.26): fails with a unified diff when any
      # modernizer rewrite is pending. Run `make fix` locally to apply.
      - name: Go fix check
        run: make fix-check

      - name: Build
        run: GOWORK=off go build ./...

      - name: Lint (full repo)
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: server
          version: v2.12
        env:
          GOWORK: "off"

      - name: Test (container-free)
        run: GOWORK=off make test-short

      # Full Method conformance gate: design rules + layer rules + the
      # design↔code ALIGNMENT/conformance passes over the committed
      # .aiarch/state/project.json (build-tagged methoddesign, so the default
      # test suite above does not cover TestMethodDesignArtifacts).
      - name: Method conformance gate
        run: make method-check

      # Drift gate for the generated Temporal layer (cmd/appgen, driving
      # framework-go-app-generator/temporalgen). Release-backed pins make this
      # GOWORK=off-safe — no go.work or ../archistrator-platform checkout needed.
      - name: Generated Temporal layer drift check
        run: make gen-temporal-check

      # Drift gate for the generated model/interface layer (cmd/modelgen,
      # driving framework-go-app-generator/modelgen). Same GOWORK=off-safe shape.
      - name: Generated model layer drift check
        run: make gen-models-check

      # Drift gate for the generated Fake<Iface> test-double layer (cmd/modelgen,
      # driving framework-go-app-generator/modelgen's GenerateFakes). Same
      # GOWORK=off-safe shape as gen-models-check; gen-fakes is an alias of
      # gen-models (one cmd/modelgen run emits both outputs), so this scopes the
      # diff to just the fake tree.
      - name: Generated fakes drift check
        run: make gen-fakes-check

      # Drift gate for the generated CLIENT layer + merged OAS (cmd/clientgen,
      # driving framework-go-http-generator + framework-go-mcp-generator). Same
      # GOWORK=off-safe shape.
      - name: Generated client layer drift check
        run: make gen-client-check

      # Drift gate for the generated internal MCP tool catalog
      # (cmd/internaltoolsgen, one tool per ResourceAccess/Engine contract
      # operation). Same GOWORK=off-safe shape; regenerates from project.json
      # and fails on any diff in
      # internal/resourceaccess/projectstate/toolcatalog.gen.go.
      - name: Generated internal tools drift check
        run: make gen-internal-tools-check

      # Drift gate for the generated client SDK emitted into the sibling
      # systemtests module (cmd/appgen, driving
      # framework-go-app-generator/transportgen). Same GOWORK=off-safe shape;
      # regenerates from project.json and fails on any diff under
      # ../systemtests/internal/sdk.
      - name: Generated SDK drift check
        run: make gen-sdk-check

      # Drift gate for the generated server config + systemtests harness
      # env-name consts (cmd/appgen, driving the published
      # framework-go-app-generator/configgen). Same GOWORK=off-safe shape;
      # regenerates from project.json's deployment model and fails on any diff
      # in cmd/server/config.gen.go or
      # ../systemtests/internal/harness/envnames.gen.go.
      - name: Generated config drift check
        run: make gen-config-check

      # Drift gate for the generated composition root (cmd/server/main.gen.go,
      # cmd/appgen driving the published framework-go-app-generator/composegen —
      # v0.5.0). Same GOWORK=off-safe shape; regenerates from project.json's
      # deployment model + service contracts and fails on any diff.
      - name: Generated composition-root drift check
        run: make gen-main-check

      # Drift gate for the generated lifecycle-phase table emitted into the
      # sibling webApp module (cmd/gen-uiprofiles, driving
      # internal/resourceaccess/projectstate's ProfileFor). Same
      # regenerate-then-diff shape as the other gen-*-check gates.
      - name: Generated UI lifecycle-profile drift check
        run: make gen-uiprofiles-check

      # Materialize the .claude method-assets from the pinned lib. The .claude
      # method tree is NOT vendored — it is gitignored and pulled from
      # method-assets (pinned via server/go.mod). This step just proves the
      # pinned release installs cleanly; app-local files (settings.json,
      # skills/grillme) are unaffected by install and remain committed.
      - name: claude-assets materialize
        working-directory: ${{ github.workspace }}
        run: |
          go run github.com/mixofreality-studio/archistrator-platform/method-assets/cmd/method-assets@v0.1.4 install --dest .
          git diff --exit-code -- .claude/settings.json .claude/skills/grillme
