name: Server Checks

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.aiarch/**/*.json'
      - '.github/workflows/server-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.aiarch/**/*.json'
      - '.github/workflows/server-checks.yml'

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run 'gofmt -w .'"; exit 1; }

      - name: Go vet
        run: GOWORK=off go vet ./...

      - name: Build
        run: GOWORK=off go build ./...

      - name: Lint (full repo)
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: server
          version: v2.12
        env:
          GOWORK: "off"

      - name: Test (container-free)
        run: GOWORK=off make test-short

      # Drift gate for the generated Temporal layer (cmd/appgen, driving
      # framework-go-app-generator/temporalgen). Release-backed pins make this
      # GOWORK=off-safe — no go.work or ../archistrator-platform checkout needed.
      - name: Generated Temporal layer drift check
        run: make gen-temporal-check

      # Drift gate for the generated model/interface layer (cmd/modelgen,
      # driving framework-go-app-generator/modelgen). Same GOWORK=off-safe shape.
      - name: Generated model layer drift check
        run: make gen-models-check

      # Drift gate for the generated CLIENT layer + merged OAS (cmd/clientgen,
      # driving framework-go-http-generator + framework-go-mcp-generator). Same
      # GOWORK=off-safe shape.
      - name: Generated client layer drift check
        run: make gen-client-check

      # Drift gate for the generated client SDK emitted into the sibling
      # systemtests module (cmd/appgen, driving
      # framework-go-app-generator/transportgen). Same GOWORK=off-safe shape;
      # regenerates from project.json and fails on any diff under
      # ../systemtests/internal/sdk.
      - name: Generated SDK drift check
        run: make gen-sdk-check

      # Drift gate for the generated server config + systemtests harness
      # env-name consts (cmd/appgen, driving the published
      # framework-go-app-generator/configgen). Same GOWORK=off-safe shape;
      # regenerates from project.json's deployment model and fails on any diff
      # in cmd/server/config.gen.go or
      # ../systemtests/internal/harness/envnames.gen.go.
      - name: Generated config drift check
        run: make gen-config-check

      # Drift gate for the generated composition root (cmd/server/main.gen.go,
      # cmd/appgen driving the published framework-go-app-generator/composegen —
      # v0.5.0). Same GOWORK=off-safe shape; regenerates from project.json's
      # deployment model + service contracts and fails on any diff.
      - name: Generated composition-root drift check
        run: make gen-main-check

      # Drift gate for the generated lifecycle-phase table emitted into the
      # sibling webApp module (cmd/gen-uiprofiles, driving
      # internal/resourceaccess/projectstate's ProfileFor). Same
      # regenerate-then-diff shape as the other gen-*-check gates.
      - name: Generated UI lifecycle-profile drift check
        run: make gen-uiprofiles-check
