name: Server Checks

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.aiarch/**/*.json'
      - '.github/workflows/server-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.aiarch/**/*.json'
      - '.github/workflows/server-checks.yml'

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run 'gofmt -w .'"; exit 1; }

      - name: Go vet
        run: GOWORK=off go vet ./...

      - name: Build
        run: GOWORK=off go build ./...

      - name: Lint (full repo)
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: server
          version: v2.12
        env:
          GOWORK: "off"

      - name: Test (container-free)
        run: GOWORK=off make test-short

      # TODO(appgen release follow-up): enable after published pins make
      # gen-temporal GOWORK=off-safe. Today `make gen-temporal` (cmd/appgen,
      # driving framework-go-app-generator/temporalgen) requires go.work + a
      # sibling ../archistrator-platform checkout — this job checks out only
      # this repo, so the drift gate cannot run here yet. Local equivalent:
      # `make gen-temporal-check` (server/Makefile) from a workspace checkout.
      # - name: Generated Temporal layer drift check
      #   run: make gen-temporal-check
