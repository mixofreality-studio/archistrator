name: UI Tests

# Runs the GENERATED client scenario tests (deterministic component testing,
# docs/superpowers/specs/2026-10-02-deterministic-component-testing-design.md).
# Every spec under uitests/generated/<component>/ is emitted by testgen from the
# committed per-component test plan; nothing in uitests/ is hand-written but each
# component's hooks.ts. The job provisions Postgres, builds the Go server and the
# state tool, starts the Vite dev server in the background, and runs
# `npm run test:scenarios` (every generated playwright.config.gen.ts in turn).
#
# ── Topology ─────────────────────────────────────────────────────────────────
#   [chromium] → [SPA dev server :5173] ──/api──▶ [Go server :8888] → Postgres
#                                                   │  (per scenario)  └▶ Temporal
#                                                   └▶ local executor → scripted `claude`
#
# A generated config carries no webServer block: hooks.before owns whatever a
# scenario needs up. The SPA must already be reachable, so it is started here;
# the Go server is NOT. Each scenario's hooks bring up a stack of their own: a
# fresh Temporal dev server (`temporal` must be on PATH), a fresh LOCAL-profile
# project repo, and the server (UITESTS_SERVER_BIN) over both on :8888 with real
# construction (CONSTRUCTION_DRYRUN=false) through the local executor, whose
# `claude` is the hooks' scripted agent — the real Claude Code CLI is never run.
# Postgres (UITESTS_POSTGRES_URL) is shared.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'webApp/**'
      - 'uitests/**'
      - '.github/workflows/uitests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'webApp/**'
      - 'uitests/**'
      - '.github/workflows/uitests.yml'

jobs:
  uitests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archistrator
          POSTGRES_PASSWORD: archistrator
          POSTGRES_DB: archistrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archistrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      # The hooks start the server per scenario; built once here for all of them.
      - name: Build the Go server and the state tool
        working-directory: server
        run: |
          GOWORK=off go build -o /tmp/uitests-bin/archistrator-server ./cmd/server
          GOWORK=off go build -o /tmp/uitests-bin/aiarch-state-mcp ./cmd/aiarch-state-mcp

      - name: Install webApp dependencies
        working-directory: webApp
        run: npm ci

      - name: Start SPA dev server
        working-directory: webApp
        run: |
          npm run dev -- --port 5173 --strictPort &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ >/dev/null 2>&1; then
              echo "SPA ready"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:5173/ >/dev/null

      - name: Install uitests dependencies
        working-directory: uitests
        run: npm ci

      # Playwright transpiles each spec without type-checking it, so nothing else
      # catches a type error in a hooks.ts. tsc covers generated/.
      - name: Typecheck uitests
        working-directory: uitests
        run: npm run typecheck

      # The selector discipline for the agent-owned hooks (no raw locator()) is
      # an ESLint rule, so it holds only where lint runs.
      - name: Lint uitests
        working-directory: uitests
        run: npm run lint

      - name: Install Playwright browsers
        working-directory: uitests
        run: npx playwright install --with-deps chromium

      - name: Run scenario tests
        working-directory: uitests
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: 'http://localhost:5173'
          UITESTS_API_PORT: '8888'
          UITESTS_POSTGRES_URL: postgres://archistrator:archistrator@localhost:5432/archistrator?sslmode=disable
          UITESTS_SERVER_BIN: /tmp/uitests-bin/archistrator-server
          UITESTS_STATE_MCP_BIN: /tmp/uitests-bin/aiarch-state-mcp
          UITESTS_WORK_DIR: /tmp/uitests-work
        run: npm run test:scenarios

      - name: Upload scenario results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-results
          # The scenario results, and each scenario's stack: its server and Temporal
          # logs and its project repo.
          path: |
            uitests/test-results/
            /tmp/uitests-work/
          retention-days: 7
