name: WebApp Checks

on:
  push:
    branches: [main]
    paths:
      - 'webApp/**'
      - 'server/api/openapi.yaml'
      - '.github/workflows/webapp-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'webApp/**'
      - 'server/api/openapi.yaml'
      - '.github/workflows/webapp-checks.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    defaults:
      run:
        working-directory: webApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Drift gate for the generated OAS-derived contract layer (scripts/gen-api.mjs
      # + scripts/gen-enums.mjs). Fails if the committed schema.ts/enums.gen.ts are
      # stale relative to server/api/openapi.yaml.
      - name: Generated contract layer drift check
        run: |
          npm run gen:api
          git diff --exit-code -- src/contracts/schema.ts src/contracts/enums.gen.ts

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
