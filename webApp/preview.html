    <!--
      PREVIEW MODE (design-renderer-data.md §2′.1, §2′.5). This page boots the SAME
      <App/> as index.html over the fixture transport (src/previewShell/main.tsx).
      Its own CSP makes the document network-dead and frame-dead whatever server
      hosts it: connect-src 'none' backs the in-page network guard, and
      frame-src 'none' turns any nested preview off inside a preview.
      Built by vite.preview.config.ts into dist-preview/index.html.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'"
    />

  </head>
