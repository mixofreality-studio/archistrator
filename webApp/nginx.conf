server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # MCP App shell assets: FIXED names (no content hash), referenced by the Go
    # server's ui:// stub with a ?v= query. Short TTL instead of immutable so a
    # deploy that forgets to bump ARCHISTRATOR_WEBAPP_ASSET_VERSION still
    # converges within minutes. Must precede the generic asset regex below.
    # NO CORS headers — classic-script delivery is CORS-exempt (spec §3.4).
    location ~ ^/(mcp-app\.js|mcp-app\.css)$ {
        add_header Cache-Control "public, max-age=300";
    }

    # Cache static assets (versioned with content hash by Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML files - always revalidate to get latest asset references
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA fallback - serve index.html for all routes (with no-cache).
    # In production, /api/* is routed to archistrator-server by an Envoy
    # HTTPRoute (not by this nginx); nginx only serves the SPA bundle.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
