components:
    schemas:
        DeliveryActiveRole:
            enum:
                - 0
                - 1
                - 2
            type: integer
            x-enum-varnames:
                - ActiveRoleNone
                - ActiveRoleArchitect
                - ActiveRoleProductManager
            x-go-base: int
        DeliveryActiveStep:
            enum:
                - 0
                - 1
                - 2
                - 3
            type: integer
            x-enum-varnames:
                - ActiveStepNone
                - ActiveStepDrafting
                - ActiveStepCritiquing
                - ActiveStepRevising
            x-go-base: int
        DeliveryActivityBuildStatus:
            enum:
                - 0
                - 1
                - 2
                - 3
            type: integer
            x-enum-varnames:
                - BuildInConstruction
                - BuildInReview
                - BuildIntegrated
                - BuildFailed
            x-go-base: int
        DeliveryActivityConstructionPhase:
            enum:
                - 0
                - 1
                - 2
                - 3
            type: integer
            x-enum-varnames:
                - ActivityConstructionNotStarted
                - ActivityConstructionRunning
                - ActivityConstructionDone
                - ActivityConstructionFailed
            x-go-base: int
        DeliveryActivityConstructionStatus:
            additionalProperties: false
            properties:
                ActivityID:
                    type: string
                BuildStatus:
                    $ref: '#/components/schemas/DeliveryActivityBuildStatus'
                    description: 'The coarse build status. Meaningless when hasBuildEvidence is false (or classified is false): its zero value names InConstruction, which on such a row reports nothing, not work in progress. Read it only when both flags are true.'
                CurrentPhase:
                    $ref: '#/components/schemas/DeliveryActivityMethodPhase'
                FailureDetail:
                    type: string
                FailureReason:
                    $ref: '#/components/schemas/DeliveryFailureReason'
                Kind:
                    $ref: '#/components/schemas/DeliveryActivityType'
                Phase:
                    $ref: '#/components/schemas/DeliveryActivityConstructionPhase'
                    description: 'The coarse lifecycle-phase roll-up. Meaningless when hasBuildEvidence is false (or classified is false): nothing has been resolved to roll up, so the value is the enum''s zero, not a reported phase. Read it only when both flags are true.'
                Phases:
                    items:
                        $ref: '#/components/schemas/DeliveryPhaseCompletion'
                    type:
                        - "null"
                        - array
                Produced:
                    items:
                        $ref: '#/components/schemas/DeliveryProducedArtifact'
                    type:
                        - "null"
                        - array
                Type:
                    $ref: '#/components/schemas/DeliveryActivityType'
                Variant:
                    $ref: '#/components/schemas/DeliveryTestingVariant'
                attempts:
                    items:
                        $ref: '#/components/schemas/DeliveryTaskAttempt'
                    type: array
                classified:
                    type: boolean
                completedAt:
                    format: date-time
                    type:
                        - "null"
                        - string
                    x-go-import: time
                    x-go-type: time.Time
                hasBuildEvidence:
                    type: boolean
                layer:
                    type: string
                layerBand:
                    type: string
                operatorNotes:
                    description: 'Every note an operator recorded against this activity (a send-back''s feedback, a steer''s reason), append-only and in recorded order. A note is pending until an agent dispatch carries it whole; then it names that dispatch''s attempt. Delivery is at-least-once: when a note''s delivery stamp cannot be written, the note stays pending and the next attempt carries it again, so an agent may see one note twice but never zero times, and never twice in the same attempt. When the pending notes exceed the 16 KiB one dispatch carries, the oldest wait for a later attempt so the newest arrives whole. A note recorded where no agent runs next (a merge-only retry, a takeover, or a finished activity) stays pending until the activity''s next agent dispatch. Omitted when there are none.'
                    items:
                        $ref: '#/components/schemas/DeliveryOperatorNote'
                    type:
                        - "null"
                        - array
                pendingResume:
                    $ref: '#/components/schemas/DeliveryPendingResume'
                    description: 'Present iff no construction pump opened this row (no start stamp) yet its attempt ledger resolves some lifecycle phases complete and others not: an integration-pending row the backfill recorded. It is NOT in flight (nothing is running it) and it is not under review. Omitted on every other row: not started, pump-written, and done.'
                recorded:
                    description: 'True iff a stored .activityExecution head-state row exists for this activity. False on a planned-no-record row: one the server emits because the committed activity list names the activity but nothing has been recorded for it yet. Such a row carries no attempts and no worstOrigin, and its BuildStatus and Phase are meaningless.'
                    type: boolean
                startedAt:
                    format: date-time
                    type:
                        - "null"
                        - string
                    x-go-import: time
                    x-go-type: time.Time
                worstOrigin:
                    description: 'The least-trustworthy provenance origin across attempts (synthesized, then backfilled, then observed). Omitted when recorded is false. Meaningless when attempts is empty: the roll-up seeds an empty ledger to observed, which says nothing was derived from anything unknown, not that anything was observed.'
                    type: string
            required:
                - ActivityID
                - Type
                - Kind
                - Variant
                - Phase
                - Phases
                - CurrentPhase
                - BuildStatus
                - Produced
                - FailureReason
                - FailureDetail
                - classified
                - hasBuildEvidence
                - recorded
                - layer
                - layerBand
            type: object
        DeliveryActivityGitStatus:
            additionalProperties: false
            properties:
                ActivityID:
                    type: string
                ArchApproved:
                    type: boolean
                BranchName:
                    type: string
                BranchRef:
                    type: string
                CICheck:
                    $ref: '#/components/schemas/DeliveryCICheckState'
                CRLabel:
                    type: string
                IsRevert:
                    type: boolean
                Merged:
                    type: boolean
                PrNumber:
                    type: integer
                PrURL:
                    type: string
                PullRequestRef:
                    type: string
                UpdatedAt:
                    format: date-time
                    type: string
                    x-go-import: time
                    x-go-type: time.Time
            required:
                - ActivityID
                - BranchName
                - BranchRef
                - PullRequestRef
                - PrNumber
                - PrURL
                - CICheck
                - ArchApproved
                - Merged
                - CRLabel
                - IsRevert
                - UpdatedAt
            type: object
        DeliveryActivityID:
            type: string
        DeliveryActivityLifecyclePhase:
            additionalProperties: false
            properties:
                completed:
                    description: True iff the gate task's state is passed.
                    type: boolean
                gateTaskId:
                    description: The review task whose pass IS this lifecycle phase's binary exit criterion.
                    type: string
                    x-go-name: GateTaskID
                id:
                    description: 'The lifecycle phase''s wire name: requirements, detailed_design, test_plan, construction or integration.'
                    type: string
                    x-go-name: ID
                label:
                    type: string
                weight:
                    description: The share of the activity's progress this lifecycle phase carries; the weights of one activity sum to 100.
                    type: integer
            required:
                - id
                - label
                - weight
                - gateTaskId
                - completed
            type: object
        DeliveryActivityMethodPhase:
