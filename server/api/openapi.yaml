                    description: not found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConstructionErrorResponse'
                    description: failed precondition
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConstructionErrorResponse'
                    description: internal error
                "503":
                    content:
                        application/json:
                            schema:
