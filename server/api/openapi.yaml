            required:
                - kind
                - notes
            type: object
        DeliveryActivityTaskKind:
            enum:
                - dispatch
                - review
            type: string
            x-enum-varnames:
                - ActivityTaskDispatch
                - ActivityTaskReview
            x-go-base: string
        DeliveryActivityTaskState:
            enum:
                - pending
                - locked
                - running
