# golangci-lint v2 config for the aiarch server.
#
# gochecksumtype enforces exhaustiveness of switch statements over the generated
# sealed sum types — the //sumtype:decl interfaces cmd/modelgen emits. It is the
# bundled form of github.com/alecthomas/go-check-sumtype (also runnable standalone
# via `make sumtype-check`).
version: "2"

linters:
  # Baseline gate (shared across archistrator-platform, server, systemtests):
  #   default "standard" set = errcheck, govet, ineffassign, staticcheck, unused
  #   + gochecksumtype + gosec. Standard gofmt only (see formatters below).
  # Generated code (// Code generated ... DO NOT EDIT.) is auto-excluded by v2.
  default: standard
  enable:
    - gochecksumtype
    - gosec
    - errorlint
    - exhaustive
    - nilnil
    # revive at its default rule set (golint successor): exported-symbol docs,
    # package comments, naming/stutter, unused parameters, builtin shadowing.
    - revive
    # gocritic at its default checker set (diagnostic + style + performance).
    - gocritic
    # Complexity gate (min-complexity 15, no exclusions — production AND test
    # files). gocognit was dropped in favor of the single cyclomatic measure.
    - gocyclo
  settings:
    gochecksumtype:
      # Treat a missing case as an error (the whole point of a sealed sum).
      default-signifies-exhaustive: false
    exhaustive:
      # Maps too: flat enum→value dispatch lives in table lookups (the
      # gocyclo-friendly form of an exhaustive switch), so a missing key must
      # fail the gate exactly like a missing case.
      check:
        - switch
        - map
    gocyclo:
      min-complexity: 15
  exclusions:
    rules:
      # gosec is a production-security linter. Test files legitimately use fake
      # credentials, loose file permissions, and testdata path reads.
      - path: "_test\\.go"
        linters:
          - gosec
      # exhaustive is scoped to production code: test files legitimately assert
      # against a handful of enum values (e.g. one expected error Kind) rather
      # than exhaustively branching over every member.
      - path: "_test\\.go"
        linters:
          - exhaustive
      # The aiarch-state MCP server is a CLI tool that inherently shells out to git
      # (a fixed, trusted binary with internal-only args) and reads research files
      # confined to the checkout (traversal-guarded). Those are the tool's purpose,
      # not injection surfaces — exclude gosec's G204/G304 for this package only.
      - path: "cmd/aiarch-state-mcp/"
        linters:
          - gosec

# Report everything: the default max-issues-per-linter/max-same-issues caps
# hide findings and make CI green/red depend on fix order.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
